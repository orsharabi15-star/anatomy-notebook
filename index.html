<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>המחברת של אור | אנטומיה</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f6;font-family:Arial,Helvetica,sans-serif;color:#163b3b}.notebook-top{padding:13px 24px;background:#fff;border-bottom:1px solid #d7e2e4;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.brand{font-size:1.1rem;font-weight:700}.notebook-tabs{display:flex;gap:8px;flex-wrap:wrap}.notebook-tabs button{font:inherit;padding:10px 18px;border:1px solid #b9d0cf;border-radius:12px;background:#fff;color:#174d4a;cursor:pointer}.notebook-tabs button[aria-pressed=true]{background:#1b746d;color:#fff;border-color:#1b746d}.notebook-tabs button:focus-visible{outline:3px solid #e5b359;outline-offset:2px}iframe{display:block;border:0;width:100%;height:calc(100dvh - 86px);min-height:450px;background:#f1f5f6}.lesson-status{font-size:.85rem;color:#4c6968;margin-right:auto}@media(max-width:650px){.notebook-top{padding:10px 12px;gap:10px}.notebook-tabs button{padding:9px 12px}.lesson-status{display:none}iframe{height:calc(100dvh - 112px)}}@media print{.notebook-top{display:none}iframe{height:100vh}}</style></head><body><header class="notebook-top"><div class="brand">המחברת של אור · אנטומיה</div><nav class="notebook-tabs" aria-label="בחירת שיעור"><button data-lesson="terminology" aria-pressed="false">1 · מינוח ומפרקים</button><button data-lesson="connective" aria-pressed="true">2 · רקמות חיבור</button><button data-lesson="epithelium" aria-pressed="false">אפיתל · Epithelium</button><button data-lesson="muscle" aria-pressed="false">3 · רקמת שריר</button><button data-lesson="spine" aria-pressed="false">4 · עמוד השדרה</button><button data-lesson="flashcards" aria-pressed="false">כרטיסיות חזרה</button></nav><span class="lesson-status">הערות והתקדמות נשמרות בדפדפן הזה</span></header><iframe id="lesson-frame" title="סיכום השיעור" allow="fullscreen" ></iframe><script type="application/json" id="notebook-lessons">[{"id": "terminology", "title": "מינוח ומפרקים"}, {"id": "connective", "title": "רקמות חיבור"}, {"id": "epithelium", "title": "אפיתל — Epithelium"}, {"id": "muscle", "title": "רקמת שריר"}, {"id": "spine", "title": "4 · עמוד השדרה"}, {"id": "flashcards", "title": "כרטיסיות חזרה"}]</script><script>
const lessons=JSON.parse(document.getElementById('notebook-lessons').textContent);
const frame=document.getElementById('lesson-frame');
function showLesson(id,section){
 const lesson=lessons.find(x=>x.id===id)||lessons[0];
 document.querySelectorAll('[data-lesson]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lesson===lesson.id)));
 frame.title=lesson.title;
 frame.onload=()=>{if(section)frame.contentWindow.postMessage({type:'notebook-section',section},location.origin)};
 frame.src='lessons/'+lesson.id+'.html';
 history.replaceState(null,'','#'+lesson.id);
}
document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>showLesson(b.dataset.lesson));
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='notebook-open-section'&&lessons.some(x=>x.id===e.data.lesson))showLesson(e.data.lesson,e.data.section)});
window.addEventListener('hashchange',()=>showLesson(location.hash.slice(1)));
showLesson(location.hash.slice(1)||'terminology');
</script></body></html>
